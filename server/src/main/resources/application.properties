server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:180000}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Upload
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Legacy model gateway aliases. Keep these so existing SiliconFlow-only deployments continue to start.
ai.deepseek.api-key=${SILICONFLOW_API_KEY}
ai.deepseek.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.deepseek.model=${LLM_MODEL:deepseek-ai/DeepSeek-V3.2}
ai.deepseek.timeout-seconds=${LLM_TIMEOUT_SECONDS:300}
ai.deepseek.input-price-per-million=${LLM_INPUT_PRICE_PER_MILLION:0}
ai.deepseek.output-price-per-million=${LLM_OUTPUT_PRICE_PER_MILLION:0}

# Provider-isolated AI connections. CHAT_* can target any OpenAI-compatible gateway.
# DEEPSEEK_API_KEY remains a compatibility fallback for existing local official-DeepSeek setups.
ai.chat.api-key=${CHAT_API_KEY:${DEEPSEEK_API_KEY:${ai.deepseek.api-key}}}
ai.chat.base-url=${CHAT_BASE_URL:${ai.deepseek.base-url}}
ai.chat.model=${CHAT_MODEL:${ai.deepseek.model}}
ai.chat.timeout-seconds=${CHAT_TIMEOUT_SECONDS:${ai.deepseek.timeout-seconds}}
ai.chat.input-price-per-million=${CHAT_INPUT_PRICE_PER_MILLION:${ai.deepseek.input-price-per-million}}
ai.chat.output-price-per-million=${CHAT_OUTPUT_PRICE_PER_MILLION:${ai.deepseek.output-price-per-million}}
ai.embedding.api-key=${EMBEDDING_API_KEY:${SILICONFLOW_API_KEY}}
ai.embedding.base-url=${EMBEDDING_BASE_URL:${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}}
ai.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
ai.asr.api-key=${ASR_API_KEY:${SILICONFLOW_API_KEY}}
ai.asr.url=${ASR_URL:https://api.siliconflow.cn/v1/audio/transcriptions}
ai.asr.model=${ASR_MODEL:TeleAI/TeleSpeechASR}

# Agent termination budget
agent.budget.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.budget.max-duration-ms=${AGENT_MAX_DURATION_MS:120000}
agent.budget.max-estimated-tokens=${AGENT_MAX_ESTIMATED_TOKENS:50000}
# 0 means disabled. When enabled, configure both provider prices above.
agent.budget.max-estimated-cost=${AGENT_MAX_ESTIMATED_COST:0}
agent.evaluation.enabled=${AGENT_EVALUATION_ENABLED:false}
# 动态预算推导（D-075）：现有 max-* 键 = 默认下限，hard-* = 全局硬上限
agent.budget.hard-max-duration-ms=${AGENT_HARD_MAX_DURATION_MS:3600000}
agent.budget.hard-max-estimated-tokens=${AGENT_HARD_MAX_ESTIMATED_TOKENS:400000}
agent.budget.tokens-per-video-second-floor=${AGENT_TOKENS_PER_VIDEO_SECOND_FLOOR:150}
agent.budget.safety-factor=${AGENT_BUDGET_SAFETY_FACTOR:1.25}
# 单次模型调用的上下文字符上限（长视频裁剪与单批 Token 估算共用；24k→96k 以覆盖技术章节，可按模型窗口调低）
agent.budget.context-max-chars=${AGENT_CONTEXT_MAX_CHARS:96000}
agent.chapter.batch-size=${AGENT_CHAPTER_BATCH_SIZE:8}

# Vector store
vector.qdrant.enabled=${QDRANT_ENABLED:true}
vector.qdrant.url=${QDRANT_URL:http://localhost:6333}
vector.qdrant.api-key=${QDRANT_API_KEY:}
vector.qdrant.collection=${QDRANT_COLLECTION:video_chunks}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET:media}
minio.public-read=${MINIO_PUBLIC_READ:false}

# Local media tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
tool.ffmpeg.dir=${FFMPEG_DIR:}
tool.ocr.command=${OCR_COMMAND:tesseract}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-producer}
rocketmq.producer.send-message-timeout=3000
rocketmq.topic.video-analysis=${ROCKETMQ_ANALYSIS_TOPIC:video-analysis-topic}
rocketmq.topic.video-analysis-dead=${ROCKETMQ_ANALYSIS_DEAD_TOPIC:video-analysis-dead-topic}
rocketmq.consumer.group=${ROCKETMQ_ANALYSIS_GROUP:video-analysis-consumer}

# Online video import (module 01)
video.import.max-url-length=${VIDEO_IMPORT_MAX_URL_LENGTH:2048}
video.import.max-items=${VIDEO_IMPORT_MAX_ITEMS:50}
video.import.user-submissions-per-minute=${VIDEO_IMPORT_SUBMIT_USER_LIMIT:60}
video.import.ip-submissions-per-minute=${VIDEO_IMPORT_SUBMIT_IP_LIMIT:120}
video.import.user-new-jobs-per-minute=${VIDEO_IMPORT_USER_LIMIT:5}
video.import.ip-new-jobs-per-minute=${VIDEO_IMPORT_IP_LIMIT:20}
video.import.global-new-jobs-per-minute=${VIDEO_IMPORT_GLOBAL_LIMIT:30}
video.import.resolve-timeout-seconds=${VIDEO_IMPORT_RESOLVE_TIMEOUT_SECONDS:60}
video.import.request-cache-ttl-hours=${VIDEO_IMPORT_REQUEST_TTL_HOURS:6}
video.import.recovery-stale-seconds=${VIDEO_IMPORT_RECOVERY_STALE_SECONDS:60}
video.import.recovery-delay-seconds=${VIDEO_IMPORT_RECOVERY_DELAY_SECONDS:30}
video.import.recovery-batch-size=${VIDEO_IMPORT_RECOVERY_BATCH_SIZE:100}
video.import.recovery-idle-backoff-max=${VIDEO_IMPORT_RECOVERY_IDLE_BACKOFF_MAX:2}
video.import.max-attempts=${VIDEO_IMPORT_MAX_ATTEMPTS:3}
# 下载并发上限与隔离：下载跑在专用执行器里，不占用 MQ 消费线程
video.import.download-concurrency=${VIDEO_IMPORT_DOWNLOAD_CONCURRENCY:4}
video.import.download-queue-capacity=${VIDEO_IMPORT_DOWNLOAD_QUEUE_CAPACITY:200}
# 是否信任反向代理写入的 X-Forwarded-For（默认关闭，避免伪造来源绕过 IP 限流）
app.security.trust-forwarded-for=${APP_TRUST_FORWARDED_FOR:false}

# B 站登录态与字幕/章节资产（D-072）：Cookie 只进 yt-dlp 与允许的 API Host，不进日志/DB/MQ
video.import.bilibili.cookie-file=${BILIBILI_COOKIE_FILE:}
video.import.bilibili.cookie-key=${BILIBILI_COOKIE_KEY:}
video.import.bilibili.cookie-allowed-hosts=${BILIBILI_COOKIE_ALLOWED_HOSTS:api.bilibili.com}
video.import.bilibili.subtitle-allowed-hosts=${BILIBILI_SUBTITLE_ALLOWED_HOSTS:aisubtitle.hdslb.com}
# 画质选择器：默认值与既有硬编码逐字符一致（480P），登录后可调高（D-045/D-072）
video.import.format-selector=${VIDEO_IMPORT_FORMAT:bv*[vcodec^=avc1][height<=480][ext=mp4]+ba[acodec^=mp4a][ext=m4a]/b[vcodec^=avc1][height<=480][ext=mp4]/bv*[vcodec^=avc1][height<=480]+ba[acodec^=mp4a]/b[height<=480]/bv*+ba/b}
# 字幕质量门槛（覆盖率按区间并集计算，回退 ASR 时计 subtitleCoverageRejected）
video.import.subtitle-enabled=${VIDEO_IMPORT_SUBTITLE_ENABLED:true}
# 一次性字幕重建开关：true 时启动即检测无字幕的 READY 媒体并重建（默认关闭）
video.import.subtitle-rebuild.enabled=${SUBTITLE_REBUILD_ENABLED:false}
# 一次性笔记重建开关：true 时启动即清理并重建全部 READY 媒体的分块/索引/笔记（默认关闭，用于分块算法升级）
video.import.note-rebuild.enabled=${NOTE_REBUILD_ENABLED:false}
video.import.subtitle-min-coverage=${VIDEO_IMPORT_SUBTITLE_MIN_COVERAGE:0.6}
video.import.subtitle-max-gap-seconds=${VIDEO_IMPORT_SUBTITLE_MAX_GAP_SECONDS:180}
video.import.subtitle-max-bytes=${VIDEO_IMPORT_SUBTITLE_MAX_BYTES:5242880}
# View 章节
video.import.chapters-enabled=${VIDEO_IMPORT_CHAPTERS_ENABLED:true}
video.import.chapters-max-bytes=${VIDEO_IMPORT_CHAPTERS_MAX_BYTES:1048576}

# Default video note: fixed, versioned analysis goal
video.note.profile-version=${VIDEO_NOTE_PROFILE_VERSION:VIDEO_NOTE_V1}
video.note.background-user-per-minute=${VIDEO_NOTE_USER_LIMIT:10}
video.note.background-global-per-minute=${VIDEO_NOTE_GLOBAL_LIMIT:60}
video.note.max-attempts=${VIDEO_NOTE_MAX_ATTEMPTS:3}
video.note.recovery-stale-seconds=${VIDEO_NOTE_RECOVERY_STALE_SECONDS:1800}

rocketmq.topic.video-import-resolve=${ROCKETMQ_VIDEO_IMPORT_RESOLVE_TOPIC:video-import-resolve-topic}
rocketmq.topic.video-import-resolve-dead=${ROCKETMQ_VIDEO_IMPORT_RESOLVE_DEAD_TOPIC:video-import-resolve-dead-topic}
rocketmq.consumer.video-import-resolve-group=${ROCKETMQ_VIDEO_IMPORT_RESOLVE_GROUP:video-import-resolve-consumer}
rocketmq.topic.video-import-acquire=${ROCKETMQ_VIDEO_IMPORT_ACQUIRE_TOPIC:video-import-acquire-topic}
rocketmq.topic.video-import-acquire-dead=${ROCKETMQ_VIDEO_IMPORT_ACQUIRE_DEAD_TOPIC:video-import-acquire-dead-topic}
rocketmq.consumer.video-import-acquire-group=${ROCKETMQ_VIDEO_IMPORT_ACQUIRE_GROUP:video-import-acquire-consumer}

# Knowledge question answering (module 02, runbook §11)
knowledge.question.max-length=${KNOWLEDGE_QUESTION_MAX_LENGTH:1000}
knowledge.question.processing-stale-seconds=${KNOWLEDGE_PROCESSING_STALE_SECONDS:300}
knowledge.question.execution-timeout-seconds=${KNOWLEDGE_EXECUTION_TIMEOUT_SECONDS:240}
knowledge.question.recovery-fixed-delay-ms=${KNOWLEDGE_RECOVERY_DELAY_MS:60000}
knowledge.question.recovery-batch-size=${KNOWLEDGE_RECOVERY_BATCH_SIZE:100}
knowledge.question.request-ttl-hours=${KNOWLEDGE_REQUEST_TTL_HOURS:24}
knowledge.question.history-max-turns=${KNOWLEDGE_HISTORY_MAX_TURNS:10}
knowledge.retrieval.max-evidence=${KNOWLEDGE_MAX_EVIDENCE:8}
knowledge.conversation.hot-ttl-minutes=${KNOWLEDGE_HOT_TTL_MINUTES:30}
knowledge.conversation.hot-max-turns=${KNOWLEDGE_HOT_MAX_TURNS:10}
knowledge.conversation.hot-max-bytes=${KNOWLEDGE_HOT_MAX_BYTES:65536}
